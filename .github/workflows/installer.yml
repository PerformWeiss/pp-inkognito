name: Installer bauen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
          python -m spacy download de_core_news_md
      - name: Kontaktdaten für das Programm (aus Geheimnis, nicht im Repository)
        shell: bash
        env:
          KONTAKT: ${{ secrets.KONTAKT_PRIVAT_JSON }}
        run: |
          if [ -n "$KONTAKT" ]; then printf '%s' "$KONTAKT" > anonymisierungstool/kontakt_privat.json; fi
      - name: Tests
        run: python -m tests.test_core
      - name: Inno Setup bereitstellen (nur Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Programm bauen
        run: python packaging/build.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: PP-Inkognito-${{ matrix.platform }}
          path: dist-zip/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "PP-Inkognito ${{ github.ref_name }} (Beta)" \
            --notes "**Beta-Version.** Bitte beim ersten Start die Anleitung beachten, denn das Programm ist nicht signiert und Mac und Windows warnen beim ersten Öffnen. **Mac:** .dmg öffnen, PP-Inkognito in den Ordner Programme ziehen, doppelklicken, auf Fertig klicken, dann Systemeinstellungen > Datenschutz & Sicherheit > ganz nach unten > Dennoch öffnen. **Windows:** Setup-Datei ausführen, bei der Warnung Weitere Informationen > Trotzdem ausführen. Die genaue Schritt-für-Schritt-Anleitung steht in der README und in der Datei LIES-MICH.txt. Die Erkennung ist nicht zu 100 % zuverlässig: bitte jedes Ergebnis prüfen." \
            --prerelease
